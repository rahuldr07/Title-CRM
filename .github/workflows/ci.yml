name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: titlecrm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/titlecrm
      APP_DATABASE_URL: postgres://app_user:ci-password@localhost:5432/titlecrm
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-anything-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Knip
        run: npm run knip

      - name: Build
        run: npm run build

      - name: Create schema
        run: npm run db:push -- --force

      - name: Apply row-level security
        run: npm run db:rls

      - name: Seed
        run: npm run db:seed

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: titlecrm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/titlecrm
      APP_DATABASE_URL: postgres://app_user:ci-password@localhost:5432/titlecrm
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-anything-real
      APP_URL: http://localhost:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Create schema
        run: npm run db:push -- --force

      - name: Apply row-level security
        run: npm run db:rls

      - name: Seed
        run: npm run db:seed

      - name: Start the API and the built front end
        run: |
          npm run server &
          npm run preview &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8787/api/health >/dev/null || {
            echo 'the API never answered on 8787'; exit 1;
          }
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4173/ >/dev/null || {
            echo 'the preview server never answered on 4173'; exit 1;
          }

      - name: Smoke
        shell: bash
        run: npm run smoke 2>&1 | tee smoke-results.txt

      - name: A lead sees no pricing
        shell: bash
        run: PRICING_URL=http://localhost:4173 npm run check:pricing

      - name: Save the smoke output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-results.txt
          if-no-files-found: warn
